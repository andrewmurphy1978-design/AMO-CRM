name: Deploy to Cloudflare

# Builds and deploys the Worker on every push to the main branch, so
# `npm run cf:deploy` no longer has to be run by hand after each change.
#
# Setup required (one-time), in the GitHub repo: Settings > Secrets and
# variables > Actions > New repository secret:
#   - CLOUDFLARE_API_TOKEN — a token with "Edit Cloudflare Workers" template
#     permissions (dash.cloudflare.com > My Profile > API Tokens > Create
#     Token), scoped to this account.
#   - CLOUDFLARE_ACCOUNT_ID — found on the right side of any page in the
#     Cloudflare dashboard, or via `npx wrangler whoami`.
#
# Database migrations: before the code is deployed, `prisma migrate deploy`
# applies any pending migration in prisma/migrations to Neon, so nothing has to be
# run by hand. It needs one more repo secret:
#   - DATABASE_URL — Neon's DIRECT (non-pooled) connection string
#     (Neon console > the project > Connect > untick "Connection pooling").
# Without it the step only prints a warning and the deploy goes on.

on:
  push:
    branches:
      - claude/andrew-murphy-crm-psambw
  workflow_dispatch:
    inputs:
      baseline:
        description: "ONE-TIME: record every migration in prisma/migrations as already applied (only if Neon already matches the schema)"
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      # Not `npx tsc --noEmit`: Next.js 16 generates a `.next/types` ambient
      # module (e.g. the `LayoutProps` type layout.tsx relies on) as part of
      # its own build, which a bare `tsc` run never triggers on a fresh
      # checkout — it fails with a false-positive "Cannot find name
      # 'LayoutProps'" every time, which is exactly what broke every deploy
      # on this branch so far. `next build` (via cf:deploy below) already
      # runs its own equivalent TypeScript check in the right order, so
      # there's nothing to duplicate here — only lint needs its own step.
      - run: npx eslint src

      # Exposed to the app (NEXT_PUBLIC_*, inlined at build time) so the
      # "Your CRM link" card in Settings can show which commit is actually
      # live — the fastest way to tell a deploy landed short of checking
      # this workflow's own run history.
      - name: Set build info
        run: |
          echo "NEXT_PUBLIC_BUILD_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      # One-time: Neon's schema was built by hand, so its _prisma_migrations history is incomplete.
      # This checks (read-only) that Neon already matches prisma/schema.prisma; only then it marks
      # every migration in the folder as applied. If Neon differs, it stops and prints the difference.
      - name: Baseline migration history (one-time)
        if: ${{ inputs.baseline }}
        run: |
          set -e
          DIFF=$(npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --script)
          echo "$DIFF"
          if ! echo "$DIFF" | grep -q "This is an empty migration"; then
            echo "::error::Neon does not match prisma/schema.prisma (see the SQL above). Nothing was changed."
            exit 1
          fi
          for d in prisma/migrations/*/; do
            npx prisma migrate resolve --applied "$(basename "$d")" || true
          done
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Apply database migrations (Neon)
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::DATABASE_URL secret is not set: pending migrations were NOT applied."
            exit 0
          fi
          npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Deploy to Cloudflare Workers
        run: npm run cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
