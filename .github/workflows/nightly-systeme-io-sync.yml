name: Nightly systeme.io sync

# Calls the CRM's own sync endpoint every 15 minutes. The endpoint itself
# (src/app/api/cron/systeme-io-sync/route.ts) checks the "Enable scheduled
# auto-sync" toggle and the chosen schedule time in Settings, and no-ops
# unless both are on and it's the right 15-minute window (America/Montreal
# time) — so this is safe to leave running at all times.
#
# Setup required (one-time):
#   1. In the GitHub repo: Settings > Secrets and variables > Actions >
#      New repository secret, named CRON_SECRET, set to the same value used
#      for the CRON_SECRET Cloudflare Worker secret.
#   2. In the CRM: Settings > "Enable scheduled auto-sync" + choose a time.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger systeme.io sync
        run: |
          curl -sS -f -X GET "https://crm.andrewmurphy.online/api/cron/systeme-io-sync" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
      - name: Trigger Buffer social analytics sync
        run: |
          curl -sS -f -X GET "https://crm.andrewmurphy.online/api/cron/buffer-sync" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
      - name: Trigger invoice status check
        run: |
          curl -sS -f -X GET "https://crm.andrewmurphy.online/api/cron/invoice-status-check" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
      - name: Trigger email inbox poll
        run: |
          curl -sS -f -X GET "https://crm.andrewmurphy.online/api/cron/email-poll" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
